<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --main: #b5502f;
      --main-dark: #7c3a22;
      --bg: #faf6f2;
      --border: #e3d9d0;
      --text: #2b2b2b;
      --muted: #777;
      --danger: #c0392b;
      --danger-bg: #fbebe9;
      --warn: #9a6a00;
      --warn-bg: #fff6dc;
      --ok: #2f7a5f;
      --edit: #2f6f9c;
      --edit-bg: #eaf3f9;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 60px;
      font-size: 15px;
    }
    .card {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 24px 20px;
    }
    #loginView.card { max-width: 420px; }
    h1 { font-size: 20px; text-align: center; color: var(--main-dark); margin: 0 0 20px; }
    h2 { font-size: 16px; color: var(--main-dark); margin: 22px 0 10px; }
    h2:first-child { margin-top: 0; }
    p.note { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin: 12px 0 6px; }
    input[type="password"], input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }
    input[type="password"] { width: 100%; font-size: 16px; padding: 12px; }
    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 16px;
      background: #eee;
      color: #555;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.primary { background: var(--main); color: #fff; }
    button.small { padding: 6px 10px; font-size: 12px; font-weight: normal; }
    button.link { background: none; color: var(--edit); text-decoration: underline; padding: 4px; font-weight: normal; }
    button.danger { background: var(--danger-bg); color: var(--danger); }
    #loginBtn { width: 100%; margin-top: 20px; padding: 14px; font-size: 16px; }
    .msg { margin-top: 10px; font-size: 13px; min-height: 1em; }
    .msg.error { color: var(--danger); }
    .msg.ok { color: var(--ok); }

    .topBar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .topBar h1 { margin: 0; text-align: left; flex: 1; }
    .topBar a { color: #888; font-size: 12px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
    .tabs button {
      background: none; color: var(--muted); border-radius: 8px 8px 0 0; padding: 10px 14px;
      border-bottom: 3px solid transparent; margin-bottom: -2px;
    }
    .tabs button.active { color: var(--main-dark); border-bottom-color: var(--main); }
    .periodRow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .periodRow label { margin: 0; }
    .tabPanel { display: none; }
    .tabPanel.active { display: block; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .checks { display: inline-flex; gap: 4px; flex-wrap: wrap; }
    .checks label { display: inline-flex; align-items: center; gap: 2px; margin: 0; font-weight: normal; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card" id="loginView">
    <h1><?= storeName ?> シフト表ログイン</h1>
    <label for="password">管理パスワード</label>
    <input type="password" id="password" placeholder="管理画面と同じパスワード">
    <button id="loginBtn" class="primary">ログイン</button>
    <div id="loginMsg" class="msg error"></div>
  </div>

  <div class="card" id="appView" style="display:none;">
    <div class="topBar">
      <h1><?= storeName ?> シフト表</h1>
      <a id="backToAdmin" href="<?= adminUrl ?>" target="_top">予約管理に戻る</a>
      <button id="logoutBtn" class="small">ログアウト</button>
    </div>

    <div class="periodRow">
      <label for="periodFrom">期間</label>
      <input type="date" id="periodFrom">
      <span>〜</span>
      <input type="date" id="periodTo">
      <button id="periodLoadBtn">表示</button>
      <span id="periodMsg" class="msg error"></span>
    </div>

    <div class="tabs">
      <button data-tab="grid" class="active">シフト表</button>
      <button data-tab="staff">スタッフ</button>
      <button data-tab="requests">希望・休み</button>
      <button data-tab="settings">枠と条件</button>
    </div>

    <div class="tabPanel active" id="tab-grid"></div>
    <div class="tabPanel" id="tab-staff"></div>
    <div class="tabPanel" id="tab-requests"></div>
    <div class="tabPanel" id="tab-settings"></div>
  </div>

  <script>var Core = (<?!= shiftCoreSource ?>)();</script>
  <script>
    var TOKEN = null;
    var CURRENT_TAB = 'grid';
    var WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];
    var KIND_LABELS = { unavailable: '出られない', prefer_off: 'できれば休み', want: '出たい' };
    /**
     * 画面の状態。data は getShiftBootstrap の結果。
     * assignments / dayOverrides / requests は画面上で編集中の内容(保存前)。
     */
    var STATE = { from: '', to: '', data: null, assignments: [], dayOverrides: [], requests: [], gridDirty: false, reqDirty: false, overridesDirty: false };
    // タブごとの描画関数(各タブの処理が登録する)
    var RENDER = {};

    function storageGet(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } }
    function storageSet(key, v) { try { if (v === null) sessionStorage.removeItem(key); else sessionStorage.setItem(key, v); } catch (e) {} }

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function el(id) { return document.getElementById(id); }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function toDateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function dayLabel(date) { return Core.formatMD(date) + '(' + WEEKDAY_LABELS[Core.weekdayOf(date)] + ')'; }
    function staffName(id) {
      var st = (STATE.data && STATE.data.staff || []).filter(function (s) { return s.id === id; })[0];
      return st ? st.name : '(不明)';
    }
    function slotName(id) {
      var sl = (STATE.data && STATE.data.settings.slots || []).filter(function (s) { return s.id === id; })[0];
      return sl ? sl.name : '';
    }

    function showMsg(id, text, isError) {
      var box = el(id);
      if (!box) return;
      box.textContent = text || '';
      box.className = 'msg ' + (isError ? 'error' : 'ok');
    }

    /**
     * サーバ関数を呼ぶ。ログイン切れ(authError)ならログイン画面に戻す。
     * 通信エラーは { success: false, message } として返す。
     */
    function callServer(name) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (res) {
            if (res && res.authError) {
              TOKEN = null;
              storageSet('adminToken', null);
              showLogin(res.message);
            }
            resolve(res || { success: false, message: '応答がありませんでした。' });
          })
          .withFailureHandler(function (err) {
            resolve({ success: false, message: '通信エラー: ' + (err && err.message ? err.message : err) });
          })[name].apply(null, args);
      });
    }

    function showLogin(message) {
      el('appView').style.display = 'none';
      el('loginView').style.display = 'block';
      showMsg('loginMsg', message || '', true);
    }

    function showApp() {
      el('loginView').style.display = 'none';
      el('appView').style.display = 'block';
    }

    function doLogin() {
      var btn = el('loginBtn');
      btn.disabled = true;
      showMsg('loginMsg', '', true);
      callServer('adminLogin', el('password').value).then(function (res) {
        btn.disabled = false;
        if (!res.success) { showMsg('loginMsg', res.message, true); return; }
        TOKEN = res.token;
        storageSet('adminToken', TOKEN);
        showApp();
        reload();
      });
    }

    function hasUnsaved() { return STATE.gridDirty || STATE.reqDirty; }
    function confirmDiscard() {
      return !hasUnsaved() || confirm('保存していない変更があります。破棄しますか?');
    }

    /** 期間のデータを読み直して、今のタブを描き直す */
    function reload() {
      var from = el('periodFrom').value, to = el('periodTo').value;
      showMsg('periodMsg', '読み込み中…', false);
      return callServer('getShiftBootstrap', TOKEN, from, to).then(function (res) {
        if (!res.success) { if (!res.authError) showMsg('periodMsg', res.message, true); return res; }
        showMsg('periodMsg', '', false);
        STATE.from = from;
        STATE.to = to;
        STATE.data = res;
        STATE.assignments = res.assignments.slice();
        STATE.dayOverrides = res.dayOverrides.slice();
        STATE.requests = res.requests.slice();
        STATE.gridDirty = false;
        STATE.reqDirty = false;
        STATE.overridesDirty = false;
        renderCurrentTab();
        return res;
      });
    }

    function renderCurrentTab() {
      if (STATE.data && RENDER[CURRENT_TAB]) RENDER[CURRENT_TAB]();
    }

    /** タブを切り替える。離れるタブに未保存の変更があれば確認し、破棄したら元に戻す */
    function showTab(name) {
      if (name !== CURRENT_TAB && STATE.data) {
        var dirty = (CURRENT_TAB === 'requests' && STATE.reqDirty) || (CURRENT_TAB === 'grid' && STATE.gridDirty);
        if (dirty) {
          if (!confirm('保存していない変更があります。破棄しますか?')) return;
          if (CURRENT_TAB === 'requests') { STATE.requests = STATE.data.requests.slice(); STATE.reqDirty = false; }
          if (CURRENT_TAB === 'grid') {
            STATE.assignments = STATE.data.assignments.slice();
            STATE.dayOverrides = STATE.data.dayOverrides.slice();
            STATE.gridDirty = false;
            STATE.overridesDirty = false;
          }
        }
      }
      CURRENT_TAB = name;
      document.querySelectorAll('[data-tab]').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
      document.querySelectorAll('.tabPanel').forEach(function (p) { p.classList.toggle('active', p.id === 'tab-' + name); });
      renderCurrentTab();
    }

    /** 期間の初期値: 来月の1日〜末日 */
    function setDefaultPeriod() {
      var now = new Date();
      el('periodFrom').value = toDateStr(new Date(now.getFullYear(), now.getMonth() + 1, 1));
      el('periodTo').value = toDateStr(new Date(now.getFullYear(), now.getMonth() + 2, 0));
    }

    function init() {
      setDefaultPeriod();
      el('loginBtn').addEventListener('click', doLogin);
      el('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
      el('logoutBtn').addEventListener('click', function () {
        TOKEN = null;
        storageSet('adminToken', null);
        showLogin('');
      });
      el('periodLoadBtn').addEventListener('click', function () { if (confirmDiscard()) reload(); });
      document.querySelectorAll('[data-tab]').forEach(function (b) {
        b.addEventListener('click', function () { showTab(b.dataset.tab); });
      });

      TOKEN = storageGet('adminToken');
      if (TOKEN) {
        showApp();
        reload();
      }
    }
  </script>
  <!-- ==== タブごとの処理(以下に追記) ==== -->
  <style>
    /* ---- スタッフ・枠と条件 ---- */
    .list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
    .staffItem { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; flex-wrap: wrap; }
    .staffItem:last-child { border-bottom: none; }
    .staffItem:hover { background: var(--bg); }
    .staffItem .nm { font-weight: bold; min-width: 6em; }
    .staffItem .meta { font-size: 12px; color: var(--muted); }
    .staffItem.inactive { color: #aaa; }
    .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--edit-bg); color: var(--edit); }
    .badge.gray { background: #eee; color: #888; }
    .formBox { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 12px 0; background: #fffdfb; }
    .formGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 12px; }
    .formGrid input { width: 100%; }
    .editRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .editRow input.sname, .editRow input.pname { width: 9em; }
    .editRow input.sreq { width: 4.5em; }
    .editRow .reqLabel { font-size: 12px; color: var(--muted); }
    .overnight { font-size: 12px; color: var(--edit); }
    .buttons { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
  <script>
    // ==================== スタッフ タブ ====================

    function weekdayChecks(cls, selected) {
      return '<span class="checks">' + WEEKDAY_LABELS.map(function (w, i) {
        return '<label><input type="checkbox" class="' + cls + '" value="' + i + '"' +
          ((selected || []).indexOf(i) !== -1 ? ' checked' : '') + '>' + w + '</label>';
      }).join('') + '</span>';
    }
    function checkedWeekdays(row, cls) {
      return Array.prototype.map.call(row.querySelectorAll('input.' + cls + ':checked'), function (c) { return Number(c.value); });
    }
    function slotOptions(selectedId, emptyLabel) {
      var opts = emptyLabel !== null ? '<option value="">' + esc(emptyLabel) + '</option>' : '';
      return opts + (STATE.data.settings.slots || []).map(function (sl) {
        return '<option value="' + esc(sl.id) + '"' + (sl.id === selectedId ? ' selected' : '') + '>' + esc(sl.name) + '</option>';
      }).join('');
    }
    function numOrEmpty(v) { return v === null || v === undefined ? '' : v; }

    RENDER.staff = function () {
      var staff = STATE.data.staff.slice().sort(function (a, b) { return (b.active - a.active); });
      var html = '<h2>スタッフ</h2><p class="note">名前をタップすると編集できます。辞めた人は削除せず「在籍を外す」にすると、過去のシフトに名前が残ります。</p>';
      html += '<div class="list" id="staffList">' + (staff.length ? staff.map(function (st) {
        var meta = [];
        if (st.positions.length) meta.push(st.positions.join('・'));
        if (st.targetDays !== null) meta.push('目安 週' + st.targetDays + '日');
        if (st.maxDays !== null) meta.push('上限 週' + st.maxDays + '日');
        if (st.maxHours !== null) meta.push('上限 週' + st.maxHours + '時間');
        return '<div class="staffItem' + (st.active ? '' : ' inactive') + '" data-staff-id="' + esc(st.id) + '">' +
          '<span class="nm">' + esc(st.name) + '</span>' +
          (st.veteran ? '<span class="badge">ベテラン</span>' : '') +
          (st.active ? '' : '<span class="badge gray">在籍外</span>') +
          '<span class="meta">' + esc(meta.join(' / ')) + '</span></div>';
      }).join('') : '<div class="staffItem">まだスタッフがいません。</div>') + '</div>';
      html += '<button id="staffAddBtn" class="primary">+ スタッフを追加</button>';
      html += '<div id="staffFormWrap"></div><div id="staffMsg" class="msg"></div>';
      el('tab-staff').innerHTML = html;
      el('staffAddBtn').addEventListener('click', function () { openStaffForm(null); });
      document.querySelectorAll('#staffList .staffItem[data-staff-id]').forEach(function (item) {
        item.addEventListener('click', function () {
          openStaffForm(STATE.data.staff.filter(function (s) { return s.id === item.dataset.staffId; })[0]);
        });
      });
    };

    function openStaffForm(st) {
      var isNew = !st;
      st = st || { id: '', name: '', positions: [], veteran: false, targetDays: null, maxDays: null, maxHours: null, active: true, note: '' };
      var positions = STATE.data.settings.positions || [];
      var html = '<div class="formBox" id="staffForm"><h2>' + (isNew ? 'スタッフを追加' : esc(st.name) + ' さんを編集') + '</h2>';
      html += '<div class="formGrid">' +
        '<div><label for="staffName">名前</label><input type="text" id="staffName" value="' + esc(st.name) + '"></div>' +
        '<div><label for="staffTarget">週の目安日数</label><input type="number" min="0" max="7" step="0.5" id="staffTarget" value="' + numOrEmpty(st.targetDays) + '" placeholder="例: 3"></div>' +
        '<div><label for="staffMaxDays">週の上限日数</label><input type="number" min="0" max="7" id="staffMaxDays" value="' + numOrEmpty(st.maxDays) + '" placeholder="なし"></div>' +
        '<div><label for="staffMaxHours">週の上限時間</label><input type="number" min="0" step="0.5" id="staffMaxHours" value="' + numOrEmpty(st.maxHours) + '" placeholder="なし"></div>' +
        '</div>';
      if (positions.length) {
        html += '<label>できる担当</label><span class="checks">' + positions.map(function (p) {
          return '<label><input type="checkbox" class="staffPos" value="' + esc(p) + '"' + (st.positions.indexOf(p) !== -1 ? ' checked' : '') + '>' + esc(p) + '</label>';
        }).join('') + '</span>';
      }
      html += '<label class="checks"><input type="checkbox" id="staffVeteran"' + (st.veteran ? ' checked' : '') + '>ベテラン(各枠に最低何人か入れたい人)</label>';
      html += '<label for="staffNote">メモ</label><input type="text" id="staffNote" style="width:100%;" value="' + esc(st.note) + '">';
      html += '<h2>いつもの条件(毎週くり返す)</h2><p class="note">例: 学生なので平日のランチは出られない、毎週水曜は休み。その日だけの希望は「希望・休み」タブで入れます(そちらが優先されます)。</p>';
      html += '<div id="recurringRows"></div><button id="recurringAddBtn" class="small">+ 条件を追加</button>';
      html += '<div class="buttons"><button id="staffSaveBtn" class="primary">保存</button><button id="staffCancelBtn">閉じる</button>' +
        (isNew ? '' : '<button id="staffActiveBtn" class="danger">' + (st.active ? '在籍を外す' : '在籍に戻す') + '</button>') + '</div></div>';
      el('staffFormWrap').innerHTML = html;

      var rules = STATE.data.recurring.filter(function (r) { return r.staffId === st.id; });
      rules.forEach(addRecurringRow);
      el('recurringAddBtn').addEventListener('click', function () { addRecurringRow(null); });
      el('staffCancelBtn').addEventListener('click', function () { el('staffFormWrap').innerHTML = ''; });
      el('staffSaveBtn').addEventListener('click', function () { saveStaff(st); });
      if (!isNew) {
        el('staffActiveBtn').addEventListener('click', function () {
          callServer('setStaffActive', TOKEN, st.id, !st.active).then(function (res) {
            if (!res.success) { showMsg('staffMsg', res.message, true); return; }
            reload().then(function () { showMsg('staffMsg', st.name + ' さんを' + (st.active ? '在籍外にしました。' : '在籍に戻しました。'), false); });
          });
        });
      }
      el('staffName').focus();
    }

    function addRecurringRow(rule) {
      rule = rule || { weekdays: [], slotId: '', kind: 'unavailable', note: '' };
      var row = document.createElement('div');
      row.className = 'editRow recurringRow';
      row.innerHTML = weekdayChecks('rwd', rule.weekdays) +
        '<select class="rslot">' + slotOptions(rule.slotId, '終日') + '</select>' +
        '<select class="rkind"><option value="unavailable"' + (rule.kind === 'unavailable' ? ' selected' : '') + '>出られない</option>' +
        '<option value="prefer_off"' + (rule.kind === 'prefer_off' ? ' selected' : '') + '>できれば休み</option></select>' +
        '<button class="small rdel" type="button">削除</button>';
      row.querySelector('.rdel').addEventListener('click', function () { row.remove(); });
      el('recurringRows').appendChild(row);
    }

    function saveStaff(st) {
      var staff = {
        id: st.id,
        name: el('staffName').value,
        positions: Array.prototype.map.call(document.querySelectorAll('.staffPos:checked'), function (c) { return c.value; }),
        veteran: el('staffVeteran').checked,
        targetDays: el('staffTarget').value, maxDays: el('staffMaxDays').value, maxHours: el('staffMaxHours').value,
        active: st.active, note: el('staffNote').value,
      };
      var rules = Array.prototype.map.call(document.querySelectorAll('#recurringRows .recurringRow'), function (row) {
        return { weekdays: checkedWeekdays(row, 'rwd'), slotId: row.querySelector('.rslot').value, kind: row.querySelector('.rkind').value, note: '' };
      });
      el('staffSaveBtn').disabled = true;
      callServer('saveStaffMember', TOKEN, staff).then(function (res) {
        if (!res.success) { el('staffSaveBtn').disabled = false; showMsg('staffMsg', res.message, true); return null; }
        return callServer('saveRecurringRules', TOKEN, res.staff.id, rules).then(function (r2) {
          if (!r2.success) {
            el('staffSaveBtn').disabled = false;
            // スタッフ自体は保存済みなので、次に保存したとき重複して追加されないよう ID を覚えておく
            st.id = res.staff.id;
            showMsg('staffMsg', r2.message, true);
            return null;
          }
          return reload().then(function () { showMsg('staffMsg', res.staff.name + ' さんを保存しました。', false); });
        });
      });
    }

    // ==================== 枠と条件 タブ ====================

    RENDER.settings = function () {
      var st = STATE.data.settings;
      var html = '<h2>担当(ポジション)</h2><p class="note">キッチン・ホールのように担当ごとに人数を決める場合だけ追加します。担当を使わない店は空のままで構いません。</p>';
      html += '<div id="posRows"></div><button id="posAddBtn" class="small">+ 担当を追加</button>';
      html += '<h2>シフト枠</h2><p class="note">ランチ・ディナー・通しなど、人を入れる時間の枠です。終了が開始より前なら翌日までの枠になります。使う曜日にチェックを入れてください。</p>';
      html += '<div id="slotRows"></div><button id="slotAddBtn" class="small">+ 枠を追加</button>';
      html += '<h2>一緒にしない組み合わせ</h2><p class="note">できるだけ同じ時間に入れないようにします。人が足りない日だけ同じ時間に入れ、シフト表に警告を出します。</p>';
      html += '<div id="pairRows"></div><button id="pairAddBtn" class="small">+ 組み合わせを追加</button>';
      html += '<h2>ベテラン</h2><div class="row">各枠にベテランを最低 <input type="number" id="minVeteran" min="0" style="width:5em;" value="' + (st.minVeteranPerSlot || 0) + '"> 人入れたい(0なら気にしない)</div>';
      html += '<div class="buttons"><button id="settingsSaveBtn" class="primary">この内容で保存</button></div><div id="settingsMsg" class="msg"></div>';
      el('tab-settings').innerHTML = html;

      (st.positions || []).forEach(addPosRow);
      var slots = st.slots && st.slots.length ? st.slots : [null];
      slots.forEach(addSlotRow);
      (st.pairRules || []).forEach(addPairRow);
      el('posAddBtn').addEventListener('click', function () { addPosRow(''); });
      el('slotAddBtn').addEventListener('click', function () { addSlotRow(null); });
      el('pairAddBtn').addEventListener('click', function () { addPairRow(null); });
      el('settingsSaveBtn').addEventListener('click', saveSettings);
    };

    function currentPositions() {
      return Array.prototype.map.call(document.querySelectorAll('#posRows input.pname'), function (i) { return i.value.trim(); })
        .filter(function (v) { return v; });
    }

    function addPosRow(name) {
      var row = document.createElement('div');
      row.className = 'editRow posRow';
      row.innerHTML = '<input type="text" class="pname" placeholder="例: キッチン" value="' + esc(name) + '"><button class="small pdel" type="button">削除</button>';
      row.querySelector('.pname').addEventListener('change', refreshSlotRequired);
      row.querySelector('.pdel').addEventListener('click', function () { row.remove(); refreshSlotRequired(); });
      el('posRows').appendChild(row);
      refreshSlotRequired();
    }

    function requiredInputs(required) {
      var positions = currentPositions();
      if (!positions.length) {
        return '<span class="reqLabel">必要人数</span><input type="number" min="0" class="sreq" data-pos="" value="' + ((required || {})[''] || '') + '">';
      }
      return positions.map(function (p) {
        return '<span class="reqLabel">' + esc(p) + '</span><input type="number" min="0" class="sreq" data-pos="' + esc(p) + '" value="' + ((required || {})[p] || '') + '">';
      }).join('');
    }

    function readRequired(row) {
      var out = {};
      row.querySelectorAll('input.sreq').forEach(function (i) { out[i.dataset.pos] = i.value === '' ? 0 : Number(i.value); });
      return out;
    }

    /** 担当が変わったら、各枠の必要人数の入力欄を作り直す(入力済みの値は担当名で引き継ぐ) */
    function refreshSlotRequired() {
      document.querySelectorAll('#slotRows .slotRow').forEach(function (row) {
        row.querySelector('.reqWrap').innerHTML = requiredInputs(readRequired(row));
      });
    }

    function updateOvernight(row) {
      var s = row.querySelector('.sstart').value, e = row.querySelector('.send').value;
      row.querySelector('.overnight').textContent = (s && e && e <= s) ? '翌日まで' : '';
    }

    function addSlotRow(slot) {
      slot = slot || { id: '', name: '', start: '', end: '', weekdays: [], required: {} };
      var row = document.createElement('div');
      row.className = 'editRow slotRow';
      row.dataset.slotId = slot.id;
      row.innerHTML = '<input type="text" class="sname" placeholder="例: ランチ" value="' + esc(slot.name) + '">' +
        '<input type="time" class="sstart" value="' + esc(slot.start) + '">〜<input type="time" class="send" value="' + esc(slot.end) + '">' +
        '<span class="overnight"></span>' + weekdayChecks('swd', slot.weekdays) +
        '<span class="reqWrap">' + requiredInputs(slot.required) + '</span>' +
        '<button class="small sdel" type="button">削除</button>';
      ['.sstart', '.send'].forEach(function (sel) {
        row.querySelector(sel).addEventListener('change', function () { updateOvernight(row); });
      });
      row.querySelector('.sdel').addEventListener('click', function () { row.remove(); });
      el('slotRows').appendChild(row);
      updateOvernight(row);
    }

    function staffOptions(selectedId) {
      return '<option value="">選んでください</option>' + STATE.data.staff.filter(function (s) { return s.active || s.id === selectedId; })
        .map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === selectedId ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
    }

    function addPairRow(rule) {
      rule = rule || { a: '', b: '' };
      var row = document.createElement('div');
      row.className = 'editRow pairRow';
      row.innerHTML = '<select class="pa">' + staffOptions(rule.a) + '</select>と<select class="pb">' + staffOptions(rule.b) + '</select>' +
        'はできれば同じ時間にしない<button class="small pdel2" type="button">削除</button>';
      row.querySelector('.pdel2').addEventListener('click', function () { row.remove(); });
      el('pairRows').appendChild(row);
    }

    function saveSettings() {
      var settings = {
        positions: Array.prototype.map.call(document.querySelectorAll('#posRows input.pname'), function (i) { return i.value; }),
        slots: Array.prototype.map.call(document.querySelectorAll('#slotRows .slotRow'), function (row) {
          return { id: row.dataset.slotId || '', name: row.querySelector('.sname').value,
            start: row.querySelector('.sstart').value, end: row.querySelector('.send').value,
            weekdays: checkedWeekdays(row, 'swd'), required: readRequired(row) };
        }),
        pairRules: Array.prototype.map.call(document.querySelectorAll('#pairRows .pairRow'), function (row) {
          return { a: row.querySelector('.pa').value, b: row.querySelector('.pb').value, type: 'avoid' };
        }),
        minVeteranPerSlot: el('minVeteran').value,
      };
      el('settingsSaveBtn').disabled = true;
      callServer('saveShiftSettings', TOKEN, settings).then(function (res) {
        el('settingsSaveBtn').disabled = false;
        if (!res.success) { showMsg('settingsMsg', res.message, true); return; }
        reload().then(function () { showMsg('settingsMsg', '保存しました。', false); });
      });
    }
  </script>

    .reqCal th { font-size: 12px; color: var(--muted); padding: 4px; }

  <script>
    // ==================== 希望・休み タブ ====================
    var REQ_TAG = { unavailable: '×', prefer_off: '休', want: '◎' };
    var REQ_STAFF = '';
    var REQ_DATE = '';

    function dayRequest(staffId, date, slotId) {
      return STATE.requests.filter(function (r) { return r.staffId === staffId && r.date === date && (r.slotId || '') === slotId; })[0];
    }
    function recurringKind(staffId, date, slotId) {
      var wd = Core.weekdayOf(date);
      var rule = STATE.data.recurring.filter(function (r) {
        return r.staffId === staffId && r.weekdays.indexOf(wd) !== -1 && (r.slotId || '') === slotId;
      })[0];
      return rule ? rule.kind : null;
    }

    /** その日のラベル。その日だけの希望は濃く、毎週の条件だけによるものは薄く出す */
    function dayTags(staffId, date) {
      var keys = [''].concat(STATE.data.settings.slots.map(function (s) { return s.id; }));
      return keys.map(function (slotId) {
        var dated = dayRequest(staffId, date, slotId);
        var kind = dated ? dated.kind : recurringKind(staffId, date, slotId);
        if (!kind) return '';
        return '<span class="reqTag ' + kind + (dated ? '' : ' fromRecurring') + '">' +
          esc((slotId ? slotName(slotId) : '') + REQ_TAG[kind]) + '</span>';
      }).join('');
    }

    RENDER.requests = function () {
      var active = STATE.data.staff.filter(function (s) { return s.active; });
      if (!active.some(function (s) { return s.id === REQ_STAFF; })) REQ_STAFF = active.length ? active[0].id : '';
      var html = '<h2>希望・休み</h2><p class="note">スタッフを選んで、日付をタップして入力します。' +
        '× 出られない / 休 できれば休み / ◎ 出たい。薄い表示はスタッフ画面の「いつもの条件」によるものです。</p>';
      if (!active.length) {
        el('tab-requests').innerHTML = html + '<p>先に「スタッフ」タブでスタッフを追加してください。</p>';
        return;
      }
      html += '<div class="row"><label for="reqStaff" style="margin:0;">スタッフ</label><select id="reqStaff">' +
        active.map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === REQ_STAFF ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('') +
        '</select></div>';
      html += '<div id="reqCalendar"></div><div id="reqPickerWrap"></div>';
      html += '<div class="buttons"><button id="reqSaveBtn" class="primary">希望を保存</button></div><div id="reqMsg" class="msg"></div>';
      el('tab-requests').innerHTML = html;
      el('reqStaff').addEventListener('change', function () { REQ_STAFF = this.value; REQ_DATE = ''; renderReqCalendar(); });
      el('reqSaveBtn').addEventListener('click', saveRequestsNow);
      renderReqCalendar();
    };

    function renderReqCalendar() {
      var dates = Core.listDates(STATE.from, STATE.to);
      var start = Core.mondayOf(STATE.from);
      var end = Core.addDays(Core.mondayOf(STATE.to), 6);
      var all = Core.listDates(start, end);
      var html = '<table class="reqCal"><thead><tr>' + [1, 2, 3, 4, 5, 6, 0].map(function (w) { return '<th>' + WEEKDAY_LABELS[w] + '</th>'; }).join('') + '</tr></thead><tbody>';
      for (var i = 0; i < all.length; i += 7) {
        html += '<tr>' + all.slice(i, i + 7).map(function (date) {
          if (dates.indexOf(date) === -1) return '<td></td>';
          var b = STATE.data.business[date] || {};
          if (b.closed) return '<td class="reqDay closed" data-date="' + date + '"><span class="d">' + Core.formatMD(date) + '</span><br>休業</td>';
          return '<td class="reqDay' + (date === REQ_DATE ? ' selected' : '') + '" data-date="' + date + '"><span class="d">' +
            Core.formatMD(date) + '</span><br>' + dayTags(REQ_STAFF, date) + '</td>';
        }).join('') + '</tr>';
      }
      el('reqCalendar').innerHTML = html + '</tbody></table>';
      document.querySelectorAll('.reqDay:not(.closed)').forEach(function (td) {
        td.addEventListener('click', function () { REQ_DATE = td.dataset.date; renderReqCalendar(); renderReqPicker(); });
      });
    }

    function renderReqPicker() {
      if (!REQ_DATE) { el('reqPickerWrap').innerHTML = ''; return; }
      var rows = [{ id: '', name: '終日' }].concat(STATE.data.settings.slots);
      var html = '<div id="reqPicker"><b>' + esc(staffName(REQ_STAFF)) + ' さん ' + dayLabel(REQ_DATE) + '</b>';
      rows.forEach(function (row) {
        var dated = dayRequest(REQ_STAFF, REQ_DATE, row.id);
        var rec = recurringKind(REQ_STAFF, REQ_DATE, row.id);
        html += '<div class="editRow"><span class="slotLbl">' + esc(row.name) + '</span><select class="reqKind" data-slot="' + esc(row.id) + '">' +
          '<option value="">指定なし' + (rec ? '(いつもは「' + KIND_LABELS[rec] + '」)' : '') + '</option>' +
          ['unavailable', 'prefer_off', 'want'].map(function (k) {
            return '<option value="' + k + '"' + (dated && dated.kind === k ? ' selected' : '') + '>' + KIND_LABELS[k] + '</option>';
          }).join('') + '</select></div>';
      });
      html += '<button id="reqPickerClose" class="small">閉じる</button></div>';
      el('reqPickerWrap').innerHTML = html;
      document.querySelectorAll('#reqPicker select.reqKind').forEach(function (sel) {
        sel.addEventListener('change', function () { setRequest(REQ_STAFF, REQ_DATE, sel.dataset.slot, sel.value); });
      });
      el('reqPickerClose').addEventListener('click', function () { REQ_DATE = ''; renderReqCalendar(); renderReqPicker(); });
    }

    function setRequest(staffId, date, slotId, kind) {
      STATE.requests = STATE.requests.filter(function (r) {
        return !(r.staffId === staffId && r.date === date && (r.slotId || '') === slotId);
      });
      if (kind) STATE.requests.push({ date: date, staffId: staffId, slotId: slotId, kind: kind, note: '' });
      STATE.reqDirty = true;
      renderReqCalendar();
    }

    function saveRequestsNow() {
      el('reqSaveBtn').disabled = true;
      callServer('saveRequests', TOKEN, STATE.from, STATE.to, STATE.requests).then(function (res) {
        el('reqSaveBtn').disabled = false;
        if (!res.success) { showMsg('reqMsg', res.message, true); return; }
        reload().then(function () { showMsg('reqMsg', '保存しました。', false); });
      });
    }
  </script>

  <script>
    // ==================== シフト表 タブ ====================
    var PICK = null; // 開いているセル { date, slotId, position }

    function gridProblem() {
      var d = STATE.data;
      return Core.buildProblem({
        from: STATE.from, to: STATE.to, settings: d.settings, staff: d.staff, requests: d.requests,
        recurring: d.recurring, business: d.business, dayOverrides: STATE.dayOverrides,
        outsideAssignments: d.outsideAssignments,
      });
    }
    function sameCell(a, date, slotId, position) { return a.date === date && a.slotId === slotId && (a.position || '') === position; }

    RENDER.grid = function () {
      var html = '<p class="note">「自動作成」で案を作り、セルをタップして手直しします。手で入れた・外した人は固定(●)になり、もう一度自動作成しても変わりません。日付をタップすると、その日だけ枠を消したり足したりできます。</p>';
      html += '<div class="gridButtons"><button id="genBtn" class="primary">自動作成</button>' +
        '<button id="genResetBtn">固定も消して作り直す</button><button id="gridSaveBtn" class="primary">保存</button>' +
        '<button id="printBtn">印刷</button></div><div id="gridMsg" class="msg"></div>';
      html += '<div id="dayPanelWrap"></div><div id="pickerWrap"></div>';
      html += '<div id="gridWrap"><table id="grid"></table></div><p class="legend">● 固定 / 赤: 守るべき条件を破っている / 黄: できれば避けたい</p>';
      html += '<div id="warnList"></div><table id="summary"></table>';
      el('tab-grid').innerHTML = html;
      if (!STATE.data.settings.slots.length) {
        el('grid').innerHTML = '<tr><td>先に「枠と条件」タブでシフト枠を作ってください。</td></tr>';
      }
      el('genBtn').addEventListener('click', function () { runGenerate(false); });
      el('genResetBtn').addEventListener('click', function () {
        if (confirm('固定した割り当ても含めて、すべて作り直します。よろしいですか?')) runGenerate(true);
      });
      el('gridSaveBtn').addEventListener('click', saveGrid);
      el('printBtn').addEventListener('click', function () { window.print(); });
      PICK = null;
      renderGridBody();
    };

    function renderGridBody() {
      if (!STATE.data.settings.slots.length) return;
      var problem = gridProblem();
      var result = Core.evaluate(problem, STATE.assignments);
      var dates = problem.dates;

      // 警告の印(セル・人)
      var cellMark = {}, whoMark = {};
      result.warnings.forEach(function (w) {
        if (!w.date || !w.slotId) return;
        var key = w.date + '|' + w.slotId;
        if (cellMark[key] !== 'err') cellMark[key] = w.level === 'error' ? 'err' : 'warn';
        w.staffIds.forEach(function (id) {
          var k = key + '|' + id;
          if (whoMark[k] !== 'err') whoMark[k] = w.level === 'error' ? 'err' : 'warn';
        });
      });
      var cellsByDateSlot = {};
      problem.cells.forEach(function (c) { (cellsByDateSlot[c.date + '|' + c.slotId] = cellsByDateSlot[c.date + '|' + c.slotId] || []).push(c); });

      var html = '<thead><tr><th class="slotHead">枠</th>' + dates.map(function (date) {
        var b = STATE.data.business[date] || {};
        var wd = Core.weekdayOf(date);
        if (b.closed) return '<th class="closedHead">' + dayLabel(date) + '<br>休業</th>';
        return '<th class="dayHead' + (wd === 6 ? ' sat' : wd === 0 ? ' sun' : '') + '" data-date="' + date + '">' + dayLabel(date) + '</th>';
      }).join('') + '</tr></thead><tbody>';
      STATE.data.settings.slots.forEach(function (slot) {
        html += '<tr><th class="slotHead">' + esc(slot.name) + '<small>' + esc(slot.start) + '-' + esc(slot.end) + '</small></th>';
        dates.forEach(function (date) {
          var cells = cellsByDateSlot[date + '|' + slot.id];
          if ((STATE.data.business[date] || {}).closed) { html += '<td class="closedCell"></td>'; return; }
          if (!cells) { html += '<td></td>'; return; }
          html += '<td data-date="' + date + '" data-slot="' + esc(slot.id) + '">' + cells.map(function (cell) {
            var people = STATE.assignments.filter(function (a) {
              return a.kind === 'assign' && sameCell(a, date, slot.id, cell.position) && problem.staffById[a.staffId];
            });
            var mark = cellMark[date + '|' + slot.id] || '';
            var short = cell.required - people.length;
            return '<div class="cellPos ' + mark + '" data-date="' + date + '" data-slot="' + esc(slot.id) + '" data-pos="' + esc(cell.position) + '">' +
              (cell.position ? '<span class="pos">' + esc(cell.position) + '</span> ' : '') +
              people.map(function (a) {
                var m = whoMark[date + '|' + slot.id + '|' + a.staffId] || '';
                return '<span class="who ' + m + (a.pinned ? ' pinned' : '') + '" data-staff="' + esc(a.staffId) + '">' + esc(staffName(a.staffId)) + '</span>';
              }).join('') +
              (short > 0 ? '<span class="short">不足' + (short > 1 ? short : '') + '</span>' : '') + '</div>';
          }).join('') + '</td>';
        });
        html += '</tr>';
      });
      el('grid').innerHTML = html + '</tbody>';

      document.querySelectorAll('#grid .cellPos').forEach(function (c) {
        c.addEventListener('click', function () {
          PICK = { date: c.dataset.date, slotId: c.dataset.slot, position: c.dataset.pos };
          renderPicker();
        });
      });
      document.querySelectorAll('#grid th.dayHead').forEach(function (th) {
        th.addEventListener('click', function () { renderDayPanel(th.dataset.date); });
      });

      el('warnList').innerHTML = result.warnings.length
        ? '<h2>警告(' + result.warnings.length + '件)</h2>' + result.warnings.map(function (w) {
          return '<div class="warnItem ' + (w.level === 'error' ? 'error' : 'warn') + '">' + esc(w.message) + '</div>';
        }).join('')
        : '';
      el('summary').innerHTML = '<thead><tr><th>スタッフ</th><th>出勤日数</th><th>目安</th><th>時間</th><th>上限(週)</th></tr></thead><tbody>' +
        result.summary.map(function (sm) {
          var st = STATE.data.staff.filter(function (s) { return s.id === sm.staffId; })[0];
          var cls = (sm.overMaxDays || sm.overMaxHours) ? 'overMax' : (Math.abs(sm.days - sm.expectedDays) > 1 ? 'offTarget' : '');
          var limits = [];
          if (st.maxDays !== null) limits.push(st.maxDays + '日');
          if (st.maxHours !== null) limits.push(st.maxHours + '時間');
          return '<tr class="staffRow ' + cls + '"><td>' + esc(sm.name) + '</td><td>' + sm.days + '日</td><td>' + sm.expectedDays + '日</td><td>' +
            sm.hours + '時間</td><td>' + (limits.join(' / ') || '-') + '</td></tr>';
        }).join('') + '</tbody>';
      if (PICK) renderPicker();
    }

    /** 候補者ごとの「入れたらどうなるか」 */
    function candidateInfo(problem, st, date, slotId, position) {
      var cell = problem.cellByKey[date + '|' + slotId + '|' + position];
      var reasons = [], blocked = false, disabled = false;
      var others = STATE.assignments.filter(function (a) {
        return a.kind === 'assign' && a.staffId === st.id && a.date === date && !sameCell(a, date, slotId, position);
      });
      if (cell && others.some(function (a) {
        var c = problem.cellByKey[Core.cellKeyOf(a)];
        return c && Core.rangesOverlap(c, cell);
      })) { reasons.push('同じ時間に別の枠'); disabled = true; }
      if (position && st.positions.indexOf(position) === -1) { reasons.push(position + 'の担当外'); blocked = true; }
      var av = Core.availability(problem, st.id, date, slotId);
      if (av === 'unavailable') { reasons.push('出られない日'); blocked = true; }
      if (av === 'prefer_off') reasons.push('休み希望');
      if (av === 'want') reasons.push('出たい');
      if (!disabled) {
        var trial = STATE.assignments.concat([{ date: date, slotId: slotId, position: position, staffId: st.id, kind: 'assign', pinned: true }]);
        var over = Core.evaluate(problem, trial).warnings.some(function (w) {
          return (w.code === 'max_days' || w.code === 'max_hours') && w.staffIds[0] === st.id;
        });
        var before = Core.evaluate(problem, STATE.assignments).warnings.some(function (w) {
          return (w.code === 'max_days' || w.code === 'max_hours') && w.staffIds[0] === st.id;
        });
        if (over && !before) { reasons.push('週の上限を超える'); blocked = true; }
      }
      if (STATE.assignments.some(function (a) { return a.kind === 'exclude' && a.staffId === st.id && a.date === date && a.slotId === slotId; })) {
        reasons.push('外した人');
      }
      return { reasons: reasons, blocked: blocked, disabled: disabled };
    }

    function renderPicker() {
      if (!PICK) { el('pickerWrap').innerHTML = ''; return; }
      var problem = gridProblem();
      var p = PICK;
      var inCell = STATE.assignments.filter(function (a) {
        return a.kind === 'assign' && sameCell(a, p.date, p.slotId, p.position) && problem.staffById[a.staffId];
      });
      var inIds = inCell.map(function (a) { return a.staffId; });
      var html = '<div id="picker"><b>' + dayLabel(p.date) + ' ' + esc(slotName(p.slotId)) + (p.position ? ' ' + esc(p.position) : '') + '</b>';
      html += '<div class="cand">' + (inCell.length ? inCell.map(function (a) {
        return '<span class="who' + (a.pinned ? ' pinned' : '') + '">' + esc(staffName(a.staffId)) + '</span>' +
          '<button class="small removeWho" data-staff="' + esc(a.staffId) + '">外す</button>' +
          (a.pinned ? '<button class="small unpinWho" data-staff="' + esc(a.staffId) + '">固定を外す</button>' : '');
      }).join('') : '<span class="note">まだ誰も入っていません。</span>') + '</div>';
      html += '<div style="margin-top:8px;font-size:13px;">追加する人:</div><div class="cand">' +
        STATE.data.staff.filter(function (s) { return s.active && inIds.indexOf(s.id) === -1; }).map(function (st) {
          var info = candidateInfo(problem, st, p.date, p.slotId, p.position);
          return '<button class="addCand' + (info.blocked || info.disabled ? ' blocked' : '') + '" data-staff="' + esc(st.id) + '"' +
            (info.disabled ? ' disabled' : '') + '>' + esc(st.name) +
            (info.reasons.length ? '<span class="reason">(' + esc(info.reasons.join('・')) + ')</span>' : '') + '</button>';
        }).join('') + '</div>';
      html += '<div class="buttons"><button id="pickerClose" class="small">閉じる</button></div></div>';
      el('pickerWrap').innerHTML = html;
      document.querySelectorAll('#picker .addCand').forEach(function (b) {
        b.addEventListener('click', function () { pickAdd(b.dataset.staff); });
      });
      document.querySelectorAll('#picker .removeWho').forEach(function (b) {
        b.addEventListener('click', function () { pickRemove(b.dataset.staff); });
      });
      document.querySelectorAll('#picker .unpinWho').forEach(function (b) {
        b.addEventListener('click', function () { pickUnpin(b.dataset.staff); });
      });
      el('pickerClose').addEventListener('click', function () { PICK = null; renderPicker(); });
    }

    function gridChanged() { STATE.gridDirty = true; renderGridBody(); }

    function pickAdd(staffId) {
      var p = PICK;
      STATE.assignments = STATE.assignments.filter(function (a) {
        return !(a.kind === 'exclude' && a.staffId === staffId && a.date === p.date && a.slotId === p.slotId);
      });
      STATE.assignments.push({ date: p.date, slotId: p.slotId, position: p.position, staffId: staffId, kind: 'assign', pinned: true });
      gridChanged();
    }

    function pickRemove(staffId) {
      var p = PICK;
      STATE.assignments = STATE.assignments.filter(function (a) {
        return !(a.staffId === staffId && a.date === p.date && a.slotId === p.slotId &&
          (a.kind === 'exclude' || (a.position || '') === p.position));
      });
      STATE.assignments.push({ date: p.date, slotId: p.slotId, position: '', staffId: staffId, kind: 'exclude', pinned: true });
      gridChanged();
    }

    function pickUnpin(staffId) {
      var p = PICK;
      STATE.assignments.forEach(function (a) {
        if (a.kind === 'assign' && a.staffId === staffId && sameCell(a, p.date, p.slotId, p.position)) a.pinned = false;
      });
      gridChanged();
    }

    /** 日付見出しのパネル: その日だけ枠を消す・足す */
    function renderDayPanel(date) {
      var slots = STATE.data.settings.slots;
      var withOverrides = {}, base = {};
      Core.buildCells(STATE.data.settings, [date], STATE.data.business, STATE.dayOverrides)
        .forEach(function (c) { withOverrides[c.slotId] = true; });
      Core.buildCells(STATE.data.settings, [date], STATE.data.business, [])
        .forEach(function (c) { base[c.slotId] = true; });
      var html = '<div id="dayPanel"><b>' + dayLabel(date) + ' の枠</b><div class="checks" style="margin-top:6px;">' +
        slots.map(function (sl) {
          return '<label><input type="checkbox" class="daySlot" value="' + esc(sl.id) + '"' + (withOverrides[sl.id] ? ' checked' : '') + '>' +
            esc(sl.name) + (base[sl.id] ? '' : '(普段はなし)') + '</label>';
        }).join('') + '</div><div class="buttons"><button id="dayPanelClose" class="small">閉じる</button></div></div>';
      el('dayPanelWrap').innerHTML = html;
      document.querySelectorAll('#dayPanel input.daySlot').forEach(function (cb) {
        cb.addEventListener('change', function () {
          var slotId = cb.value;
          STATE.dayOverrides = STATE.dayOverrides.filter(function (o) { return !(o.date === date && o.slotId === slotId); });
          if (cb.checked !== !!base[slotId]) STATE.dayOverrides.push({ date: date, slotId: slotId, state: cb.checked ? 'on' : 'off' });
          if (!cb.checked) {
            STATE.assignments = STATE.assignments.filter(function (a) { return !(a.date === date && a.slotId === slotId); });
          }
          STATE.overridesDirty = true;
          if (PICK && PICK.date === date && PICK.slotId === slotId) PICK = null;
          gridChanged();
        });
      });
      el('dayPanelClose').addEventListener('click', function () { el('dayPanelWrap').innerHTML = ''; });
    }

    function setGridBusy(busy) {
      ['genBtn', 'genResetBtn', 'gridSaveBtn'].forEach(function (id) { el(id).disabled = busy; });
    }

    function runGenerate(resetPins) {
      setGridBusy(true);
      showMsg('gridMsg', '作成中…(最大30秒ほど)', false);
      var current = resetPins ? [] : STATE.assignments;
      // 画面上の日別枠(未保存を含む)を渡して作る。ここでは何も保存しない
      callServer('generateShift', TOKEN, STATE.from, STATE.to, current, STATE.dayOverrides).then(function (res) {
        setGridBusy(false);
        if (!res.success) { showMsg('gridMsg', res.message, true); return; }
        STATE.assignments = res.assignments;
        PICK = null;
        gridChanged();
        showMsg('gridMsg', '作成しました。内容を確認して「保存」を押してください。', false);
      });
    }

    function saveGrid() {
      setGridBusy(true);
      callServer('saveShiftPeriod', TOKEN, STATE.from, STATE.to, STATE.assignments, STATE.dayOverrides).then(function (res) {
        setGridBusy(false);
        if (!res.success) { showMsg('gridMsg', res.message, true); return; }
        STATE.overridesDirty = false;
        reload().then(function () { showMsg('gridMsg', '保存しました。', false); });
      });
    }
  </script>
  <script>document.addEventListener('DOMContentLoaded', init);</script>
</body>
